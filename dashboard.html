<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📊 Dashboard — Stationary CJ Logistices</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --primary: #6c5ce7;
    --primary-dark: #5a4bd1;
    --primary-light: #a29bfe;
    --accent: #fd79a8;
    --bg: #f0f2f8;
    --card: #ffffff;
    --border: #e2e6f0;
    --text: #2d3436;
    --muted: #636e72;
    --green: #00b894;
    --green-dark: #00a381;
    --amber: #fdcb6e;
    --red: #e17055;
    --blue: #0984e3;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
    --shadow-lg: 0 8px 30px rgba(0,0,0,.1);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    padding: 24px 20px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 22px; font-weight: 800; }
  header .subtitle { font-size: 13px; opacity: .85; margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .header-actions select, .header-actions button {
    padding: 8px 14px; border-radius: 10px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .header-actions select { background: rgba(255,255,255,.2); color: #fff; }
  .header-actions select option { color: #333; }
  .btn-email { background: #fff; color: var(--primary); }
  .btn-email:hover { background: #f0edff; }
  .btn-back { background: rgba(255,255,255,.15); color: #fff; }
  .btn-back:hover { background: rgba(255,255,255,.25); }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* Summary Cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  }
  .card.purple::before { background: var(--primary); }
  .card.green::before { background: var(--green); }
  .card.amber::before { background: var(--amber); }
  .card.red::before { background: var(--red); }
  .card.blue::before { background: var(--blue); }
  .card .icon { font-size: 28px; margin-bottom: 6px; }
  .card .label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .card .value { font-size: 26px; font-weight: 800; margin-top: 2px; }
  .card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Charts Grid */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; margin-bottom: 24px; }
  .chart-box {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow);
  }
  .chart-box h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
  .chart-box canvas { width: 100% !important; }

  /* Full-width chart */
  .chart-full { grid-column: 1 / -1; }

  /* Table */
  .table-box {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); margin-bottom: 24px; overflow-x: auto;
  }
  .table-box h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 8px; background: #f5f6fa; font-weight: 600; color: var(--muted); border-bottom: 2px solid var(--border); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: #f8f9fd; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge-pending { background: #fef3cd; color: #856404; }
  .badge-approved { background: #d4fce4; color: #00864a; }
  .badge-rejected { background: #fde8e8; color: #c0392b; }
  .badge-restock { background: #e8f4fd; color: #0984e3; }
  .badge-requisition { background: #fff3e6; color: #e17055; }

  /* Loading */
  .loading { text-align: center; padding: 60px 20px; color: var(--muted); }
  .loading .spinner { font-size: 40px; animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 600px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
    header h1 { font-size: 18px; }
    .card .value { font-size: 20px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>📊 Dashboard — Stationary CJ Logistices</h1>
    <div class="subtitle">สรุปรายงานระบบเบิกอุปกรณ์สำนักงาน CJ Logistics</div>
  </div>
  <div class="header-actions">
    <select id="monthSelect" onchange="loadDashboard()">
    </select>
    <button class="btn-email" onclick="emailSummary()">📧 ส่งอีเมลสรุป</button>
    <a href="requisition.html" class="btn-back" style="text-decoration:none">🛍️ กลับหน้าร้าน</a>
  </div>
</header>

<div class="container">
  <div id="dashboardContent">
    <div class="loading"><div class="spinner">⏳</div><p style="margin-top:12px">กำลังโหลดข้อมูล...</p></div>
  </div>
</div>

<script>
const TURSO_URL = 'https://stationary-cj-logistices-cdc-security.aws-ap-south-1.turso.io/v2/pipeline';
const TURSO_TOKEN = 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODg0MjkxNjYsImlkIjoiMDFhMDY2YWUtNTgwMS03NmRjLWJiYjYtMGI0MGNiMjA1ZmUwIiwia2lkIjoiQTViaWJQOERRWVhrUlVVNFMzWWgyRnpxajVvZnhmaHFMTFY4ZXZnWjRQZyIsInJpZCI6Ijc2NWY0ZGU0LWVmNDYtNDkxMy1hYmZjLTg4OGJkYTU3NzI1ZCJ9.RAcfHAvGpdIYptARAyIWz0auYemDwWwNkZB_8dc_Ybp6q9ohCflj67s4RXOzTBE3pRpryMPyGvVO40kJ7z8OBw';
let allOrders = [];
let allHistory = [];
let allProducts = [];
let charts = {};

async function turso(sql, args) {
  const stmt = args ? { sql, args } : { sql };
  const body = { requests: [{ type: 'execute', stmt }, { type: 'close' }] };
  try {
    const res = await fetch(TURSO_URL, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + TURSO_TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const json = await res.json();
    return json.results ? json.results[0] : json;
  } catch (e) { console.error('Turso error:', e); return { cols: [], rows: [] }; }
}
function tursoRows(r) {
  if (!r || !r.cols || !r.rows) return [];
  return r.rows.map(row => {
    const obj = {};
    r.cols.forEach((col, i) => { obj[col.name] = row[i]; });
    return obj;
  });
}

// Populate month selector
function initMonths() {
  const sel = document.getElementById('monthSelect');
  const now = new Date();
  const months = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const names = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    months.push({ key, label: names[d.getMonth()] + ' ' + (d.getFullYear() + 543) });
  }
  sel.innerHTML = months.map((m, i) => '<option value="' + m.key + '"' + (i === 0 ? ' selected' : '') + '>' + m.label + '</option>').join('');
}

async function loadDashboard() {
  const month = document.getElementById('monthSelect').value;
  document.getElementById('dashboardContent').innerHTML = '<div class="loading"><div class="spinner">⏳</div><p style="margin-top:12px">กำลังโหลดข้อมูล...</p></div>';

  try {
    const [prodR, orderR, histR] = await Promise.all([
      turso('SELECT * FROM products ORDER BY id'),
      turso('SELECT * FROM orders ORDER BY id DESC'),
      turso('SELECT * FROM stock_history ORDER BY id DESC')
    ]);
    allProducts = tursoRows(prodR);
    allOrders = tursoRows(orderR);
    allHistory = tursoRows(histR);
    // Parse items JSON
    allOrders.forEach(o => { try { o.items = JSON.parse(o.items || '[]'); } catch(e) { o.items = []; } });
  } catch (e) { console.error('Load error:', e); }

  // Filter by month
  const orders = allOrders.filter(o => o.date && String(o.date).substring(0, 7) === month && o.status !== 'deleted');
  const history = allHistory.filter(h => h.date && String(h.date).substring(0, 7) === month);

  renderDashboard(orders, history, month);
}

function renderDashboard(orders, history, month) {
  const el = document.getElementById('dashboardContent');

  // === Summary Stats ===
  const totalOrders = orders.length;
  const totalAmount = orders.reduce((s, o) => s + (o.total || 0), 0);
  const pendingOrders = orders.filter(o => o.status === 'pending').length;
  const approvedOrders = orders.filter(o => o.status === 'approved').length;
  const rejectedOrders = orders.filter(o => o.status === 'rejected').length;
  const restocks = history.filter(h => h.type === 'restock');
  const requisitions = history.filter(h => h.type === 'requisition');
  const totalRestockQty = restocks.reduce((s, h) => s + h.qty, 0);
  const totalRequisitionQty = requisitions.reduce((s, h) => s + Math.abs(h.qty), 0);

  // Unique requesters
  const uniqueRequesters = new Set(orders.map(o => o.emp_id)).size;

  const monthNames = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const [y, m] = month.split('-');
  const monthName = monthNames[Number(m) - 1] + ' ' + (Number(y) + 543);

  let html = '';

  // Cards
  html += '<div class="cards">';
  html += card('purple', '📋', 'คำสั่งซื้อทั้งหมด', totalOrders, 'รายการ');
  html += card('green', '💰', 'ยอดเบิกรวม', '฿' + totalAmount.toLocaleString(), approvedOrders + ' อนุมัติแล้ว');
  html += card('amber', '⏳', 'รออนุมัติ', pendingOrders, 'รายการ');
  html += card('red', '❌', 'ถูกปฏิเสธ', rejectedOrders, 'รายการ');
  html += card('blue', '👤', 'ผู้เบิก', uniqueRequesters, 'คน');
  html += card('green', '📦', 'เติมสต็อก', totalRestockQty, 'ชิ้น (' + restocks.length + ' ครั้ง)');
  html += card('red', '📤', 'เบิกสต็อก', totalRequisitionQty, 'ชิ้น (' + requisitions.length + ' รายการ)');
  html += '</div>';

  // Charts
  html += '<div class="charts">';

  // 1. Orders by status (doughnut)
  html += '<div class="chart-box"><h3>📊 สถานะคำสั่งซื้อ</h3><canvas id="chartStatus" height="220"></canvas></div>';

  // 2. Top 10 items (bar)
  html += '<div class="chart-box"><h3>🏆 Top 10 สินค้าเบิกสูงสุด</h3><canvas id="chartTopItems" height="220"></canvas></div>';

  // 3. By reqType (doughnut)
  html += '<div class="chart-box"><h3>🏷️ แยกตามประเภทผู้เบิก</h3><canvas id="chartReqType" height="220"></canvas></div>';

  // 4. Stock movement (bar - restock vs requisition by day)
  html += '<div class="chart-box"><h3>🔄 การเคลื่อนไหวสต็อกรายวัน</h3><canvas id="chartStockDay" height="220"></canvas></div>';

  // 5. Top spending (horizontal bar)
  html += '<div class="chart-box chart-full"><h3>💸 Top 15 ผู้เบิกยอดสูงสุด</h3><canvas id="chartTopSpenders" height="250"></canvas></div>';

  // 6. Spending by category
  html += '<div class="chart-box chart-full"><h3>📦 ยอดเบิกตามหมวดหมู่สินค้า</h3><canvas id="chartCategory" height="200"></canvas></div>';

  html += '</div>';

  // Recent Orders Table
  if (orders.length) {
    html += '<div class="table-box"><h3>📋 รายละเอียดคำสั่งซื้อเดือน ' + monthName + '</h3>';
    html += '<table><thead><tr><th>#</th><th>วันที่</th><th>รหัสพนักงาน</th><th>ชื่อ</th><th>ประเภท</th><th>รายการ</th><th>ยอดรวม</th><th>สถานะ</th></tr></thead><tbody>';
    orders.sort((a, b) => b.id - a.id).forEach(o => {
      const statusClass = o.status === 'approved' ? 'badge-approved' : o.status === 'rejected' ? 'badge-rejected' : 'badge-pending';
      const statusText = o.status === 'approved' ? 'อนุมัติ' : o.status === 'rejected' ? 'ปฏิเสธ' : 'รออนุมัติ';
      const itemsText = (o.items || []).map(function(i) { return (i.emoji || '📦') + ' ' + i.name + ' x' + i.qty; }).join(', ');
      html += '<tr><td>' + o.id + '</td><td>' + o.date + '</td><td><b>' + (o.emp_id || '') + '</b></td><td>' + o.name + '</td><td><span class="badge badge-pending">' + (o.req_type || '') + '</span></td><td style="max-width:300px;font-size:12px">' + itemsText + '</td><td style="font-weight:700">฿' + (o.total || 0).toLocaleString() + '</td><td><span class="badge ' + statusClass + '">' + statusText + '</span></td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // Stock History Table
  if (history.length) {
    html += '<div class="table-box"><h3>📝 ประวัติการเคลื่อนไหวสต็อก</h3>';
    html += '<table><thead><tr><th>วันที่</th><th>รหัส</th><th>สินค้า</th><th>ประเภท</th><th>จำนวน</th><th>คงเหลือ</th><th>โดย</th><th>หมายเหตุ</th></tr></thead><tbody>';
    history.slice(0, 50).forEach(h => {
      const typeClass = h.type === 'restock' ? 'badge-restock' : 'badge-requisition';
      const typeText = h.type === 'restock' ? 'เติมของ' : 'เบิก';
      const qtyColor = h.qty > 0 ? 'var(--green)' : 'var(--red)';
      html += '<tr><td>' + h.date + '</td><td>' + (h.product_code || '') + '</td><td>' + (h.product_name || '') + '</td><td><span class="badge ' + typeClass + '">' + typeText + '</span></td><td style="color:' + qtyColor + ';font-weight:700">' + (h.qty > 0 ? '+' : '') + h.qty + '</td><td>' + h.balance + '</td><td>' + (h.by_whom || '') + '</td><td style="font-size:12px">' + (h.note || '') + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  el.innerHTML = html;

  // Render charts (wrapped in try/catch so dashboard still shows cards+tables if Chart.js fails)
  try { renderCharts(orders, history); } catch(e) { console.warn('Chart render skipped:', e); }
}

function renderCharts(orders, history) {
  if (typeof Chart === 'undefined') { console.warn('Chart.js not loaded'); return; }
  // Destroy old charts
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  const chartDefaults = { responsive: true, plugins: { legend: { labels: { font: { size: 12 } } } } };

  // 1. Status Doughnut
  const statusCounts = { pending: 0, approved: 0, rejected: 0 };
  orders.forEach(o => { if (statusCounts[o.status] !== undefined) statusCounts[o.status]++; });
  charts.status = new Chart(document.getElementById('chartStatus'), {
    type: 'doughnut',
    data: {
      labels: ['⏳ รออนุมัติ', '✅ อนุมัติแล้ว', '❌ ปฏิเสธ'],
      datasets: [{ data: [statusCounts.pending, statusCounts.approved, statusCounts.rejected], backgroundColor: ['#fdcb6e', '#00b894', '#e17055'], borderWidth: 0 }]
    },
    options: { ...chartDefaults, cutout: '60%' }
  });

  // 2. Top 10 Items (bar)
  const itemMap = {};    orders.forEach(function(o) { (o.items || []).forEach(function(i) {
    var k = i.name;
    if (!itemMap[k]) itemMap[k] = { name: (i.emoji || '📦') + ' ' + i.name, code: i.code || '', qty: 0, amt: 0 };
    itemMap[k].qty += i.qty;
    itemMap[k].amt += (i.price || 0) * i.qty;
  }); });
  const topItems = Object.values(itemMap).sort((a, b) => b.qty - a.qty).slice(0, 10);
  charts.topItems = new Chart(document.getElementById('chartTopItems'), {
    type: 'bar',
    data: {
      labels: topItems.map(i => i.name + (i.code ? ' (' + i.code + ')' : '')),
      datasets: [{ label: 'จำนวน', data: topItems.map(i => i.qty), backgroundColor: '#a29bfe', borderRadius: 6 }]
    },
    options: { ...chartDefaults, indexAxis: 'y', plugins: { legend: { display: false } } }
  });

  // 3. ReqType Doughnut
  const typeMap = {};
  orders.forEach(function(o) { var t = o.req_type || 'อื่นๆ'; typeMap[t] = (typeMap[t] || 0) + 1; });
  const typeLabels = Object.keys(typeMap);
  const typeColors = ['#6c5ce7', '#fd79a8', '#00b894', '#fdcb6e', '#e17055', '#0984e3', '#00cec9'];
  charts.reqType = new Chart(document.getElementById('chartReqType'), {
    type: 'doughnut',
    data: {
      labels: typeLabels,
      datasets: [{ data: typeLabels.map(t => typeMap[t]), backgroundColor: typeColors.slice(0, typeLabels.length), borderWidth: 0 }]
    },
    options: { ...chartDefaults, cutout: '60%' }
  });

  // 4. Stock Movement by Day (bar)
  const dayMap = {};
  history.forEach(h => {
    const day = String(h.date).substring(8, 10);
    if (!dayMap[day]) dayMap[day] = { restock: 0, requisition: 0 };
    if (h.type === 'restock') dayMap[day].restock += h.qty;
    else dayMap[day].requisition += Math.abs(h.qty);
  });
  const days = Object.keys(dayMap).sort();
  charts.stockDay = new Chart(document.getElementById('chartStockDay'), {
    type: 'bar',
    data: {
      labels: days.map(d => 'วันที่ ' + d),
      datasets: [
        { label: '📦 เติมของ', data: days.map(d => dayMap[d].restock), backgroundColor: '#00b894', borderRadius: 6 },
        { label: '📤 เบิก', data: days.map(d => dayMap[d].requisition), backgroundColor: '#e17055', borderRadius: 6 }
      ]
    },
    options: { ...chartDefaults, scales: { x: { stacked: false }, y: { beginAtZero: true } } }
  });

  // 5. Top Spenders (horizontal bar)
  var spenderMap = {};
  orders.forEach(function(o) {
    var k = (o.emp_id || '') + '|' + o.name;
    if (!spenderMap[k]) spenderMap[k] = { label: (o.emp_id || '') + ' ' + o.name, total: 0, count: 0 };
    spenderMap[k].total += (o.total || 0);
    spenderMap[k].count++;
  });
  const topSpenders = Object.values(spenderMap).sort((a, b) => b.total - a.total).slice(0, 15);
  charts.topSpenders = new Chart(document.getElementById('chartTopSpenders'), {
    type: 'bar',
    data: {
      labels: topSpenders.map(s => s.label),
      datasets: [
        { label: 'ยอดเงิน (฿)', data: topSpenders.map(s => s.total), backgroundColor: '#6c5ce7', borderRadius: 6, yAxisID: 'y' },
        { label: 'จำนวนคำสั่งซื้อ', data: topSpenders.map(s => s.count), backgroundColor: '#fdcb6e', borderRadius: 6, yAxisID: 'y1' }
      ]
    },
    options: {
      ...chartDefaults,
      indexAxis: 'y',
      scales: {
        y: { beginAtZero: true },
        y1: { position: 'right', beginAtZero: true, grid: { drawOnChartArea: false } }
      }
    }
  });

  // 6. Category Spending (bar)
  const catMap = {};
  orders.forEach(function(o) { (o.items || []).forEach(function(i) {
    var c = i.cat || 'อื่นๆ';
    if (!catMap[c]) catMap[c] = 0;
    catMap[c] += (i.price || 0) * (i.qty || 0);
  }); });
  const catLabels = Object.keys(catMap).sort((a, b) => catMap[b] - catMap[a]);
  const catColors = ['#6c5ce7', '#fd79a8', '#00b894', '#fdcb6e', '#e17055', '#0984e3', '#00cec9', '#636e72'];
  charts.category = new Chart(document.getElementById('chartCategory'), {
    type: 'bar',
    data: {
      labels: catLabels,
      datasets: [{ label: 'ยอดเงิน (฿)', data: catLabels.map(c => catMap[c]), backgroundColor: catColors.slice(0, catLabels.length), borderRadius: 8 }]
    },
    options: { ...chartDefaults, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

function card(cls, icon, label, value, sub) {
  return '<div class="card ' + cls + '"><div class="icon">' + icon + '</div><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + (sub || '') + '</div></div>';
}

async function emailSummary() {
  var month = document.getElementById('monthSelect').value;
  if (!confirm('ส่งอีเมลสรุปรายงานเดือนนี้?')) return;
